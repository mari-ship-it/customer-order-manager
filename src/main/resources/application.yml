spring:

  application:
    name: customer-order-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: "123"
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  output:
    ansi:
      enabled: always
